name: SEC Financial Filing Pipeline

on:
  schedule:
    - cron: '0 12 * * *'  # Runs automatically every day at 12:00 PM UTC
  workflow_dispatch:      # Gives you a "Run workflow" button in Chrome!

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Script
        run: python src/fetch_filings.py
